server.port=${PORT:8080}
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:goalportal}
spring.datasource.username=${DB_USER:admin}
spring.datasource.password=${DB_PASSWORD:secret}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

jwt.secret=${JWT_SECRET:your_super_secret_key_that_is_at_least_32_bytes_long_for_security}
jwt.expiration=86400000

anthropic.api.key=${ANTHROPIC_API_KEY:your_claude_key}
