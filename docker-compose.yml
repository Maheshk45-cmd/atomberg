version: '3.8'
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: goalportal
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secret
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://db:5432/goalportal
      DB_USER: admin
      DB_PASSWORD: secret
      JWT_SECRET: your_super_secret_key_at_least_32_chars_long_secure
      ANTHROPIC_API_KEY: your_claude_key_here
    depends_on:
      - db

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata:
